name: Prepare release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Check initial release is finalized
        id: state
        shell: bash
        run: |
          current_version="$(uv run --frozen cz version -p)"
          if ! git rev-parse -q --verify "refs/tags/v${current_version}" >/dev/null; then
            echo "v${current_version} is not tagged; use the controlled bootstrap workflow first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Determine next version
        if: steps.state.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          set +e
          next_version="$(uv run --frozen cz bump --dry-run --yes --get-next)"
          status=$?
          set -e
          if [[ $status -eq 3 || $status -eq 21 ]]; then
            echo "No releasable Conventional Commit found."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
      - name: Refresh release branch from main
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_BRANCH: release/next
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected_sha="$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          uv run --frozen cz bump --yes --check-consistency
          git tag -d "v$RELEASE_VERSION"
          git push --force-with-lease="refs/heads/$RELEASE_BRANCH:$expected_sha" \
            origin HEAD:"refs/heads/$RELEASE_BRANCH"
      - name: Create or update the release pull request
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/next
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          title="ci: prepare release v$RELEASE_VERSION"
          body="Automated release preparation for v$RELEASE_VERSION, regenerated from current main. Keep this PR open while merging other changes. Merge when ready to release; then publish the generated draft GitHub Release to publish the GHCR image."
          pr="$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "$title" --body "$body"
          fi
      - name: Close superseded automated release pull requests
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr list --base main --state open --limit 100 \
            --json number,headRefName,author \
            --jq '.[] | select(.author.login == "app/github-actions" or .author.login == "github-actions[bot]") | select(.headRefName | startswith("release/v")) | .number' \
            | while read -r pr; do gh pr close "$pr"; done
