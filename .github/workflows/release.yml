name: Prepare release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Check initial release is finalized
        id: state
        shell: bash
        run: |
          current_version="$(uv run --frozen cz version -p)"
          if ! git rev-parse -q --verify "refs/tags/v${current_version}" >/dev/null; then
            echo "v${current_version} is not tagged; use the controlled bootstrap workflow first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Determine next version
        if: steps.state.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          set +e
          next_version="$(uv run --frozen cz bump --dry-run --yes --get-next)"
          status=$?
          set -e
          if [[ $status -eq 3 || $status -eq 21 ]]; then
            echo "No releasable Conventional Commit found."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then exit "$status"; fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
      - name: Check release branch
        if: steps.version.outputs.should_release == 'true'
        id: branch
        env:
          RELEASE_BRANCH: release/v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare and push release branch
        if: steps.version.outputs.should_release == 'true' && steps.branch.outputs.exists == 'false'
        env:
          RELEASE_BRANCH: release/v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run cz bump --yes --check-consistency
          git tag -d "v${{ steps.version.outputs.version }}"
          git push origin HEAD:"refs/heads/${RELEASE_BRANCH}"
      - name: Ensure release pull request
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/v${{ steps.version.outputs.version }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url' | grep -q .; then
            exit 0
          fi
          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "bump: version $RELEASE_VERSION" \
            --body "Automated release preparation for v$RELEASE_VERSION. Merge after checks pass. The workflow will create a draft GitHub Release from CHANGELOG.md; publish that draft to build and publish the GHCR image."
