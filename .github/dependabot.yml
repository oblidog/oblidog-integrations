version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
