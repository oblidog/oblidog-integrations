services:
  ekartoteka:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduled-run"]
    command: ["ekartoteka"]
    env_file:
      - .env.ekartoteka
    restart: "no"
    volumes:
      - ekartoteka-state:/home/app/.local/state/oblidog-integrations

  iprzedszkole:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduled-run"]
    command: ["iprzedszkole"]
    env_file:
      - .env.iprzedszkole
    restart: "no"
    volumes:
      - iprzedszkole-state:/home/app/.local/state/oblidog-integrations

  nju-account-one:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduled-run"]
    command: ["nju"]
    env_file:
      - .env.nju.account-one
    restart: "no"
    volumes:
      - nju-account-one-state:/home/app/.local/state/oblidog-integrations

  nju-account-two:
    image: ghcr.io/oblidog/oblidog-integrations:${OBLIDOG_INTEGRATIONS_VERSION:?Set an immutable release tag in .env}
    entrypoint: ["/usr/local/bin/oblidog-scheduled-run"]
    command: ["nju"]
    env_file:
      - .env.nju.account-two
    restart: "no"
    volumes:
      - nju-account-two-state:/home/app/.local/state/oblidog-integrations

volumes:
  ekartoteka-state:
  iprzedszkole-state:
  nju-account-one-state:
  nju-account-two-state:
