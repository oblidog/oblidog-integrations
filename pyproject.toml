[project]
name = "oblidog-integrations"
version = "0.4.2"
description = "Batch and one-shot integrations for Oblidog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27,<0.29",
  "oblidog-client==0.1.2",
  "pydantic>=2.0",
  "structlog>=25.0",
]

[project.scripts]
oblidog-integrations = "oblidog_integrations.cli:main"

[dependency-groups]
dev = [
  "commitizen>=4.18.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
pre_bump_hooks = ["uv lock"]
version_provider = "commitizen"
version = "0.4.2"
version_files = ["pyproject.toml:^version = \"(?P<version>.*)\""]
annotated_tag = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oblidog_integrations"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "ekartoteka_e2e: read-only tests against the live e-Kartoteka API",
]
