[project]
name = "oblidog-integrations"
version = "0.4.6"
description = "Batch and one-shot integrations for Oblidog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "holidays>=0.99,<1.0",
  "httpx>=0.27,<0.29",
  "oblidog-client==0.2.0",
  "pydantic>=2.0",
  "structlog>=25.0",
]

[project.scripts]
oblidog-scheduler-log = "oblidog_integrations.scheduler_logging:main"
oblidog-integrations = "oblidog_integrations.cli:main"

[dependency-groups]
dev = [
  "commitizen>=4.18.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "ty>=0.0.84",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
changelog_file = "CHANGELOG.md"
pre_bump_hooks = ["uv lock"]
version_provider = "commitizen"
version = "0.4.6"
version_files = ["pyproject.toml:^version = \"(?P<version>.*)\""]
annotated_tag = true
bump_message = "ci: bump version $current_version → $new_version"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oblidog_integrations"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "ekartoteka_e2e: read-only tests against the live e-Kartoteka API",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PGH"]
allowed-confusables = ["–"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "scripts"]
